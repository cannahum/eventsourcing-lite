services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: eventstore
    ports:
      - "5432:5432"

  localstack:
    image: localstack/localstack
    restart: always
    environment:
      SERVICES: dynamodb
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566" # LocalStack Gateway
      - "8000:4566" # Alias for DynamoDB
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock" # Needed for LocalStack
